name: CI
on: [ pull_request, push, workflow_dispatch ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  build-njfa:
    name: Build njfa keymaps
    runs-on: ubuntu-latest
    container: ghcr.io/qmk/qmk_cli
    strategy:
      fail-fast: false
      matrix:
        include:
        - keyboard: aki27/cocot38mini/v1
          keymap: njfa-v1
        - keyboard: aki27/cocot38mini/v2
          keymap: njfa-v2

    steps:
    - name: (actions) Checkout Vial repo
      uses: actions/checkout@v3
      with:
        persist-credentials: false
        submodules: recursive

    - name: Install QMK Python dependencies
      run: /opt/uv/tools/qmk/bin/python3 -m pip install -r requirements.txt

    - name: Build ${{ matrix.keyboard }}:${{ matrix.keymap }}
      run: |
        git config --global --add safe.directory $(pwd)
        qmk compile -kb "${{ matrix.keyboard }}" -km "${{ matrix.keymap }}"

    - name: List firmware artifacts
      run: |
        find .build -maxdepth 1 -type f \( -name '*.bin' -o -name '*.hex' -o -name '*.uf2' \) -print
        find . -maxdepth 1 -type f \( -name '*.bin' -o -name '*.hex' -o -name '*.uf2' \) -print

    - name: Upload firmware artifact
      uses: actions/upload-artifact@v4
      with:
        name: cocot38mini-${{ matrix.keymap }}
        path: |
          .build/*.bin
          .build/*.hex
          .build/*.uf2
          *.bin
          *.hex
          *.uf2
        if-no-files-found: error
